name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: noir-launcher
          path: app/build/outputs/apk/release/*.apk

      # A fixed download link for installing straight from the TV:
      # https://github.com/davidsr4321/tcl-streamer/releases/download/latest/noir.apk
      - name: Copy APK for the download link
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/release/app-release.apk noir.apk

      - name: Publish the download link
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: noir.apk
